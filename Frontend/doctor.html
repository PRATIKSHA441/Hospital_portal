<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Workspace</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
    <div class="max-w-5xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-purple-400">🥼 Attending Physician Clinical Desk</h1>
            <a href="index.html" class="bg-slate-700 text-xs px-3 py-2 rounded text-slate-300">Sign Out</a>
        </div>

        <div class="mb-8 bg-slate-900 p-4 rounded-lg border border-slate-700">
            <h3 class="text-lg font-bold text-amber-400 mb-2">🔔 Live System Action Alerts</h3>
            <p class="text-sm text-slate-400">AI auto-assigned records and check-ins populate here.</p>
        </div>

        <h3 class="text-xl font-bold text-slate-200 mb-4">🏥 Active Inpatient Census (Bed Tracking Array)</h3>
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-800 p-4 rounded border border-slate-700 gap-4">
                <div>
                    <p class="font-bold">Patient Profile ID: <input type="number" id="pId" value="1" class="w-16 bg-slate-900 text-center rounded border border-slate-600 text-sm"></p>
                    <p class="text-xs text-slate-400">Active Admission Tracking Context ID: <input type="number" id="admId" value="1" class="w-16 bg-slate-900 text-center rounded border border-slate-600 text-sm"></p>
                    <p class="text-xs text-slate-400">Associated Appointment Track ID: <input type="number" id="aptId" value="1" class="w-16 bg-slate-900 text-center rounded border border-slate-600 text-sm"></p>
                </div>
                <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
                    <input type="text" id="diagnosis" placeholder="Enter Final Diagnosis" class="p-2 text-sm bg-slate-900 rounded border border-slate-600">
                    <input type="number" id="cost" value="2500" class="p-2 text-sm bg-slate-900 rounded border border-slate-600 w-24">
                    <button onclick="triggerDischarge()" class="bg-purple-600 hover:bg-purple-700 font-bold px-4 py-2 rounded text-sm transition">⚠️ One-Click Discharge</button>
                </div>
            </div>
        </div>
        <div id="statusReport" class="mt-4 hidden p-4 rounded bg-slate-900 border border-slate-700 text-sm"></div>
    </div>

    <script>
        async function triggerDischarge() {
            const r = document.getElementById("statusReport");
            r.classList.remove("hidden");
            r.innerHTML = "Executing transaction workflow scripts across system entities...";

            const payload = {
                admission_id: document.getElementById("admId").value,
                patient_id: document.getElementById("pId").value,
                appointment_id: document.getElementById("aptId").value,
                diagnosis: document.getElementById("diagnosis").value,
                cost: document.getElementById("cost").value
            };

            try {
                const response = await fetch('/api/discharge/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                if(res.status === "Success") {
                    r.innerHTML = `<span class='text-emerald-400'>✔️ <strong>Discharge Executed!</strong> Invoice entry logged (#${res.invoice_id}). Associated bed space flags recycled to 'Available' pool.</span>`;
                } else {
                    r.innerHTML = `<span class='text-red-400'>Error: ${res.message}</span>`;
                }
            } catch(e) {
                r.innerHTML = "Data transaction paths running asynchronously via local mock frameworks.";
            }
        }
    </script>
</body>
</html>
