<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Portal - Login</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-3xl font-bold text-center mb-6 text-emerald-400">🏥 Hospital Portal Login</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400">Username</label>
                <input type="text" id="username" class="w-full mt-1 p-3 bg-slate-700 rounded border border-slate-600 focus:outline-none focus:border-emerald-400">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400">Password</label>
                <input type="password" id="password" class="w-full mt-1 p-3 bg-slate-700 rounded border border-slate-600 focus:outline-none focus:border-emerald-400">
            </div>
            <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-600 p-3 rounded font-bold transition">Access Portal</button>
            <div class="mt-6 border-t border-slate-700 pt-4 text-center">
                <p class="text-xs text-slate-500 mb-2"> HIPAA Compliance Role Simulation Shortcuts:</p>
                <div class="flex justify-between gap-2">
                    <a href="patient.html" class="text-xs text-blue-400 hover:underline">Patient view</a>
                    <a href="doctor.html" class="text-xs text-purple-400 hover:underline">Doctor view</a>
                    <a href="admin.html" class="text-xs text-amber-400 hover:underline">Admin / Desk view</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        function handleLogin() {
            alert("Prototype Routing Active: Please click a shortcut link below to simulate role access matrices.");
        }
    </script>
</body>
</html>
